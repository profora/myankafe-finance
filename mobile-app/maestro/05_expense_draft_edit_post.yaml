      id: "New entry"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "New entry"
- extendedWaitUntil:
    visible:
      id: "Description"
    timeout: 60000
- tapOn:
    id: "Type"
- tapOn: "Expense"
- tapOn:
    id: "Description"
- inputText: "November rent"
- tapOn:
    id: "Paid from"
- tapOn: "Cash Drawer (MMK)"
- tapOn:
    id: "Split 1 account"
- tapOn: "6210 Rent"
- tapOn:
    id: "Amount"
- inputText: "25000"
- scrollUntilVisible:
    element:
      id: "Save Draft"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Save Draft"
- extendedWaitUntil:
    visible:
      id: "Status Draft"
    timeout: 60000
- assertVisible: "November rent"
- tapOn:
    id: "Edit"
- extendedWaitUntil:
    visible:
      id: "Description"
    timeout: 30000
- tapOn:
    id: "Description"
- eraseText

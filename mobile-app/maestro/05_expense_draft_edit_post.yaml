- scrollUntilVisible:
    element:
      id: "Save Draft"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Save Draft"
- extendedWaitUntil:
    visible:
      id: "Status Draft"
    timeout: 60000
- assertVisible: "November rent posted"
- tapOn:
    id: "Post"
- tapOn: "Post"
- extendedWaitUntil:
    visible:
      id: "Status Posted"
    timeout: 60000
- assertVisible: "6210 Rent"
- assertVisible: "Debit 25000.000000"
- assertVisible: "1110 Cash on Hand"

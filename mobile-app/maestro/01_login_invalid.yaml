appId: com.myankafe.finance
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 90000
- tapOn:
    id: "Username"
- inputText: "ci-bookkeeper"
- tapOn:
    id: "Password"
- inputText: "wrong-password-xx"
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "invalid username or password"
    timeout: 30000
- assertVisible: "Sign in"

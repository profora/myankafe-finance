appId: com.myankafe.finance
---
- tapOn: "Transactions"
- extendedWaitUntil:
    visible: "Search"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "New entry"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "New entry"
- extendedWaitUntil:
    visible: "Save & Post"
    timeout: 30000
- tapOn:
    id: "Type"
- tapOn: "Expense"
- tapOn:
    id: "Description"
- inputText: "Attachment failure probe"
- tapOn:
    id: "Paid from"
- extendedWaitUntil:
    visible: "Cash Drawer (MMK)"
    timeout: 30000
- tapOn: "Cash Drawer (MMK)"
- scrollUntilVisible:
    element:
      id: "Split 1 account"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Split 1 account"
- extendedWaitUntil:
    visible: "6210 Rent"
    timeout: 30000
- tapOn: "6210 Rent"
- tapOn:
    id: "Amount"
- inputText: "100"
- scrollUntilVisible:
    element:
      id: "Attach sample receipt"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Attach sample receipt"
- assertVisible: "e2e-receipt.png"
- scrollUntilVisible:
    element:
      id: "Save & Post"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Save & Post"
- tapOn: "Post"
- extendedWaitUntil:
    visible: "Draft kept"
    timeout: 90000
- tapOn: "Open draft"
- extendedWaitUntil:
    visible:
      id: "Status Draft"
    timeout: 60000
- assertVisible: "Attachment failure probe"
- tapOn:
    id: "Cancellation reason"
- inputText: "e2e cleanup"
- tapOn:
    id: "Cancel draft"
- tapOn: "Cancel draft"
- extendedWaitUntil:
    visible:
      id: "Status Voided"
    timeout: 60000

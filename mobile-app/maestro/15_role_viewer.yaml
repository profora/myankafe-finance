appId: com.myankafe.finance
---
- runFlow:
    file: helpers/open_profile.yaml
- tapOn:
    id: "Sign out"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 60000
- runFlow:
    file: helpers/login.yaml
    env:
      USERNAME: "ci-viewer"
      PASSWORD: ${VIEWER_PASSWORD}
- scrollUntilVisible:
    element: "This role can review but not post entries."
    direction: DOWN
    timeout: 60000
- assertVisible: "This role can review but not post entries."
- assertNotVisible:
    id: "New Expense"
- assertNotVisible:
    id: "New Income"
- assertNotVisible:
    id: "Transfer"

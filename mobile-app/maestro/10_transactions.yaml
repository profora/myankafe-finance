appId: com.myankafe.finance
---
- runFlow:
    file: helpers/open_transactions.yaml
- assertVisible:
    id: "Any status"
- tapOn:
    id: "Status POSTED"
- tapOn:
    id: "Filter EXPENSE"
- tapOn:
    id: "^Search$"
- eraseText
- inputText: "November rent posted"
- tapOn:
    id: "Status POSTED"
- extendedWaitUntil:
    visible: "November rent posted"
    timeout: 60000
- assertVisible: "November rent posted"
- tapOn: "November rent posted"
- extendedWaitUntil:
    visible: "Status Posted"
    timeout: 30000

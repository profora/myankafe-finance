appId: com.myankafe.finance
---
- runFlow:
    file: helpers/open_transactions.yaml
- tapOn:
    id: "^Search$"
- eraseText
- inputText: "November rent posted"
- hideKeyboard
- scrollUntilVisible:
    element: "November rent posted"
    direction: DOWN
    timeout: 60000
- assertVisible: "November rent posted"
- tapOn:
    id: "Status POSTED"
- assertVisible: "November rent posted"
- tapOn:
    id: "Filter EXPENSE"
- assertVisible: "November rent posted"
- tapOn: "November rent posted"
- extendedWaitUntil:
    visible: "Status Posted"
    timeout: 30000

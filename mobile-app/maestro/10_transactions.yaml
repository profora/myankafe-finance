appId: com.myankafe.finance
---
- runFlow:
    file: helpers/open_transactions.yaml
- assertVisible:
    id: "New entry"
- assertVisible:
    id: "Any status"
- scrollUntilVisible:
    element:
      id: "Status POSTED"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Status POSTED"
- scrollUntilVisible:
    element:
      id: "Filter EXPENSE"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Filter EXPENSE"
- scrollUntilVisible:
    element:
      id: "^Search$"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "^Search$"
- eraseText
- inputText: "November rent posted"
# Keep the Transactions tab focused; do not press keys that can leave the tab root.
- extendedWaitUntil:
    visible: "November rent posted"
    timeout: 60000
- assertVisible:
    id: "Tab Transactions"
- assertVisible: "November rent posted"
- tapOn: "November rent posted"
- extendedWaitUntil:
    visible:
      id: "Status Posted"
    timeout: 30000

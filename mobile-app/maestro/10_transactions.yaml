appId: com.myankafe.finance
---
- runFlow:
    file: helpers/open_transactions.yaml
- assertVisible:
    id: "New entry"
- tapOn:
    id: "^Search$"
- eraseText
- inputText: "November rent posted"
# Android Back dismisses the IME when open; it does not leave New Entry here.
- pressKey: Back
- extendedWaitUntil:
    visible: "November rent posted"
    timeout: 60000
- assertVisible: "November rent posted"
- tapOn:
    id: "Status POSTED"
- assertVisible: "November rent posted"
- tapOn:
    id: "Filter EXPENSE"
- assertVisible: "November rent posted"
- tapOn: "November rent posted"
- extendedWaitUntil:
    visible: "Status Posted"
    timeout: 30000

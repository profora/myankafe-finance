appId: com.myankafe.finance
---
- tapOn:
    id: "Username"
- eraseText
- inputText: ${USERNAME}
- tapOn:
    id: "Password"
- eraseText
- inputText: ${PASSWORD}
# Physical devices (tall Gboard) cover Sign in; Enter dismisses via TextField onSubmitEditing.
- runFlow:
    file: dismiss_ime.yaml
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "MyanKafe Finance"
    timeout: 60000

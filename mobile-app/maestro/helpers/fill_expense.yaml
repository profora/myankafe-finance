appId: com.myankafe.finance
---
- extendedWaitUntil:
    visible:
      id: "^Description$"
    timeout: 60000
- tapOn:
    id: "^Type$"
- tapOn: "Expense"
- tapOn:
    id: "^Description$"
- eraseText
- inputText: ${DESCRIPTION}
- hideKeyboard
- assertVisible: ${DESCRIPTION}
- tapOn:
    id: "Paid from"
- extendedWaitUntil:
    visible: "Cash Drawer (MMK)"
    timeout: 30000
- tapOn: "Cash Drawer (MMK)"
- extendedWaitUntil:
    visible:
      id: "Split 1 account"
    timeout: 30000
- tapOn:
    id: "Split 1 account"
- extendedWaitUntil:
    visible: ${SPLIT_ACCOUNT}
    timeout: 30000
- tapOn: ${SPLIT_ACCOUNT}
- extendedWaitUntil:
    visible:
      id: "Amount"
    timeout: 30000
- tapOn:
    id: "Amount"
- eraseText
- inputText: ${AMOUNT}
- hideKeyboard
- assertVisible: ${DESCRIPTION}
- scrollUntilVisible:
    element: ${TOTAL_LABEL}
    direction: DOWN
    timeout: 30000
- assertVisible: ${TOTAL_LABEL}

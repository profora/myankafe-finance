appId: com.myankafe.finance
---
# Leave stack screens, then open the Reports tab.
- repeat:
    times: 8
    while:
      notVisible: "Profit & Loss"
    commands:
      - runFlow:
          when:
            visible: "Reports"
          commands:
            - tapOn: "Reports"
      - runFlow:
          when:
            notVisible: "Reports"
          commands:
            - pressKey: back
- extendedWaitUntil:
    visible: "Profit & Loss"
    timeout: 30000

appId: com.myankafe.finance
---
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "Current entity MyanKafe"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "Open reports"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "Open reports"
- extendedWaitUntil:
    visible: "Profit & Loss"
    timeout: 60000

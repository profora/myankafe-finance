appId: com.myankafe.finance
---
# Android often places the caret mid-field; eraseText only deletes left of caret.
# Prefer Select All + single erase; fall back to right-edge caret + long erase.
- tapOn:
    id: ${FIELD_ID}
- longPressOn:
    id: ${FIELD_ID}
- runFlow:
    when:
      visible: "Select All"
    commands:
      - tapOn: "Select All"
- eraseText: 1
- runFlow:
    when:
      notVisible:
        id: ${FIELD_ID}
        text: ${VALUE}
    commands:
      - tapOn:
          id: ${FIELD_ID}
          point: "95%,50%"
      - eraseText: 48
- inputText: ${VALUE}
- assertVisible:
    id: ${FIELD_ID}
    text: ${VALUE}

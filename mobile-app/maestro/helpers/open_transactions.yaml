appId: com.myankafe.finance
---
# Relaunch lands on Home (session kept). Prefer the Home CTA over the tab
# label so we do not fight Android/system "Transactions" matches.
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "Current entity MyanKafe"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "Open transactions"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "Open transactions"
- extendedWaitUntil:
    visible:
      id: "New entry"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "Any status"
    direction: UP
    timeout: 60000

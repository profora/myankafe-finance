appId: com.myankafe.finance
---
# Restart the Activity without clearing storage. Android back from a
# replaced stack screen exits to launcher3; do not pressKey back here.
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "Current entity MyanKafe"
    timeout: 120000
- tapOn: "Transactions"
- extendedWaitUntil:
    visible:
      id: "New entry"
    timeout: 60000

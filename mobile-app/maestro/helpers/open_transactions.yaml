appId: com.myankafe.finance
---
# Resume the app if Android back left the launcher, then open Transactions.
# Never spam back: that exits the app onto launcher3 (false Home/Search).
- launchApp:
    clearState: false
    stopApp: false
- runFlow:
    when:
      visible:
        id: "Status Posted"
    commands:
      - pressKey: back
- runFlow:
    when:
      visible:
        id: "Status Draft"
    commands:
      - pressKey: back
- runFlow:
    when:
      visible:
        id: "Status Voided"
    commands:
      - pressKey: back
- runFlow:
    when:
      notVisible:
        id: "New entry"
    commands:
      - tapOn: "Transactions"
- extendedWaitUntil:
    visible:
      id: "New entry"
    timeout: 60000

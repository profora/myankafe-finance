appId: com.myankafe.finance
---
- runFlow:
    file: ensure_session.yaml
# Infinix/3-button nav: tab a11y bounds extend under system nav; center taps miss. Aim at icon.
- tapOn:
    id: "Tab Transactions"
    point: "50%,15%"
- extendedWaitUntil:
    visible:
      id: "New entry"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "Any status"
    direction: UP
    timeout: 60000

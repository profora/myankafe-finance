appId: com.myankafe.finance
---
# Relaunch restores the Home tab (session kept). Avoid tapOn "Home" — that
# string also matches the Android launcher content-desc after stopApp.
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "Current entity MyanKafe"
    timeout: 120000
- scrollUntilVisible:
    element:
      id: "New Income"
    direction: DOWN
    timeout: 60000

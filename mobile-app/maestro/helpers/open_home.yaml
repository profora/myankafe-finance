appId: com.myankafe.finance
---
# Relaunch restores session. Prefer Tab Home over tapOn "Home" (launcher conflict).
- launchApp:
    clearState: false
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "Current entity MyanKafe"
    timeout: 120000
- tapOn:
    id: "Tab Home"
- scrollUntilVisible:
    element:
      id: "New Income"
    direction: DOWN
    timeout: 60000

appId: com.myankafe.finance
---
- tapOn: "Transactions"
- extendedWaitUntil:
    visible: "Search"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "New entry"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "New entry"
- extendedWaitUntil:
    visible: "Save & Post"
    timeout: 30000
- tapOn:
    id: "Type"
- tapOn: "Income"
- tapOn:
    id: "Description"
- inputText: "Coffee sales"
- tapOn:
    id: "Received into"
- tapOn: "Cash Drawer (MMK)"
- tapOn:
    id: "Sales channel"
- tapOn: "COUNTER"
- tapOn:
    id: "Split 1 account"
- tapOn: "4110 Coffee & Beverage Sales"
- tapOn:
    id: "Amount"
- inputText: "80000"
- scrollUntilVisible:
    element:
      id: "Attach sample receipt"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Attach sample receipt"
- assertVisible: "e2e-receipt.png"
- scrollUntilVisible:
    element:
      id: "Save & Post"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Save & Post"
- tapOn: "Post"
- extendedWaitUntil:
    visible:
      id: "Status Posted"
    timeout: 90000
- assertVisible: "Coffee sales"
- assertVisible: "e2e-receipt.png"
- assertVisible: "1110 Cash on Hand"
- assertVisible: "Debit 80000.000000"

appId: com.myankafe.finance
---
- runFlow:
    file: helpers/open_transactions.yaml
- scrollUntilVisible:
    element:
      id: "New entry"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "New entry"
- extendedWaitUntil:
    visible:
      id: "^Description$"
    timeout: 90000
- tapOn:
    id: "^Type$"
- tapOn: "Income"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible:
      id: "^Sales channel$"
    timeout: 60000
- tapOn:
    id: "^Description$"
- eraseText
- inputText: "Coffee sales"
- hideKeyboard
- tapOn:
    id: "Received into"
- extendedWaitUntil:
    visible: "Cash Drawer (MMK)"
    timeout: 30000
- tapOn: "Cash Drawer (MMK)"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "^Sales channel$"
    direction: DOWN
    timeout: 60000
- tapOn:
    id: "^Sales channel$"
- extendedWaitUntil:
    visible: "COUNTER"
    timeout: 30000
- tapOn: "COUNTER"
- scrollUntilVisible:
    element:
      id: "Split 1 account"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Split 1 account"
- extendedWaitUntil:
    visible: "4110 Coffee & Beverage Sales"
    timeout: 30000
- tapOn: "4110 Coffee & Beverage Sales"
- tapOn:
    id: "Amount"
- eraseText
- inputText: "80000"
- hideKeyboard
- extendedWaitUntil:
    visible: "Total 80000 MMK"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "Attach sample receipt"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Attach sample receipt"
- assertVisible: "e2e-receipt.png"
- scrollUntilVisible:
    element:
      id: "Save & Post"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Save & Post"
- tapOn: "Post"
- extendedWaitUntil:
    visible:
      id: "Status Posted"
    timeout: 90000
- assertVisible: "Coffee sales"
- assertVisible: "e2e-receipt.png"
- scrollUntilVisible:
    element: "Debit 80000.000000 · Credit 0.000000"
    direction: DOWN
    timeout: 30000
- assertVisible: "1110 Cash on Hand"
- assertVisible: "Debit 0.000000 · Credit 80000.000000"

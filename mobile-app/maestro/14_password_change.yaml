appId: com.myankafe.finance
---
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Change password"
    timeout: 30000
- tapOn: "Change password"
- extendedWaitUntil:
    visible: "Current password"
    timeout: 30000
- tapOn:
    id: "Current password"
- inputText: ${BOOKKEEPER_PASSWORD}
- tapOn:
    id: "New password"
- inputText: ${BOOK_NEXT_PASSWORD}
- tapOn: "Change password"
- extendedWaitUntil:
    visible: "Profile"
    timeout: 60000
- assertVisible: "ci-bookkeeper"
- tapOn: "Sign out"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 60000
- runFlow:
    file: helpers/login.yaml
    env:
      USERNAME: "ci-bookkeeper"
      PASSWORD: ${BOOK_NEXT_PASSWORD}

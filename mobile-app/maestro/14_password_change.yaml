appId: com.myankafe.finance
---
- runFlow:
    file: helpers/open_profile.yaml
- tapOn:
    id: "Change password"
- extendedWaitUntil:
    visible: "Current password"
    timeout: 30000
- tapOn:
    id: "Current password"
- inputText: ${BOOKKEEPER_PASSWORD}
- tapOn:
    id: "New password"
- inputText: ${BOOK_NEXT_PASSWORD}
- runFlow:
    file: helpers/dismiss_ime.yaml
# Use the button testID — plain text also matches the screen title.
- tapOn:
    id: "Change password"
- extendedWaitUntil:
    visible: "Active sessions"
    timeout: 60000
- assertVisible: "ci-bookkeeper"
- tapOn:
    id: "Sign out"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 60000
- runFlow:
    file: helpers/login.yaml
    env:
      USERNAME: "ci-bookkeeper"
      PASSWORD: ${BOOK_NEXT_PASSWORD}

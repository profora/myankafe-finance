appId: com.myankafe.finance
---
- tapOn: "Home"
- extendedWaitUntil:
    visible: "New Expense"
    timeout: 30000
- tapOn: "New Expense"
- extendedWaitUntil:
    visible: "Save Draft"
    timeout: 30000
- tapOn:
    id: "Description"
- inputText: "Office and utilities"
- tapOn:
    id: "Paid from"
- tapOn: "Cash Drawer (MMK)"
- tapOn:
    id: "Split 1 account"
- tapOn: "6520 Office Supplies"
- tapOn:
    id: "Amount"
- inputText: "10000"
- tapOn: "Add split"
- scrollUntilVisible:
    element:
      id: "Split 2 account"
    direction: DOWN
- tapOn:
    id: "Split 2 account"
- tapOn: "6220 Utilities"
- tapOn:
    id: "Amount"
    index: 1
- inputText: "5000"
- assertVisible: "Total 15000"
- tapOn: "Save & Post"
- tapOn: "Post"
- extendedWaitUntil:
    visible: "Status Posted"
    timeout: 90000
- assertVisible: "6520 Office Supplies"
- assertVisible: "6220 Utilities"
- assertVisible: "Debit 10000.000000"
- assertVisible: "Debit 5000.000000"

appId: com.myankafe.finance
---
- runFlow:
    file: helpers/open_transactions.yaml
- scrollUntilVisible:
    element:
      id: "New entry"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "New entry"
- extendedWaitUntil:
    visible:
      id: "Description"
    timeout: 60000
- tapOn:
    id: "Type"
- tapOn: "Expense"
- tapOn:
    id: "Description"
- eraseText
- inputText: "Office and utilities"
- tapOn:
    id: "Paid from"
- extendedWaitUntil:
    visible: "Cash Drawer (MMK)"
    timeout: 30000
- tapOn: "Cash Drawer (MMK)"
- scrollUntilVisible:
    element:
      id: "Split 1 account"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Split 1 account"
- extendedWaitUntil:
    visible: "6520 Office Supplies"
    timeout: 30000
- tapOn: "6520 Office Supplies"
- tapOn:
    id: "Amount"
- eraseText
- inputText: "10000"
- tapOn:
    id: "Add split"
- scrollUntilVisible:
    element:
      id: "Split 2 account"
    direction: DOWN
    timeout: 30000
- tapOn:
    id: "Split 2 account"
- extendedWaitUntil:
    visible: "6220 Utilities"
    timeout: 30000
- tapOn: "6220 Utilities"
- tapOn:
    id: "Amount"
    index: 1
- eraseText
- inputText: "5000"
- hideKeyboard
- extendedWaitUntil:
    visible: "Total 15000 MMK"
    timeout: 30000
- swipe:
    direction: UP
    duration: 500
- tapOn:
    id: "Save & Post"
- tapOn: "Post"
- extendedWaitUntil:
    visible:
      id: "Status Posted"
    timeout: 90000
- assertVisible: "6520 Office Supplies"
- assertVisible: "6220 Utilities"
- scrollUntilVisible:
    element: "Debit 10000.000000 · Credit 0.000000"
    direction: DOWN
    timeout: 30000
- assertVisible: "Debit 5000.000000 · Credit 0.000000"
- assertVisible: "Debit 0.000000 · Credit 15000.000000"

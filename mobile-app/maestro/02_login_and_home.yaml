appId: com.myankafe.finance
---
- runFlow: helpers/boot_login.yaml
- runFlow:
    file: helpers/login.yaml
    env:
      USERNAME: "ci-bookkeeper"
      PASSWORD: ${BOOKKEEPER_PASSWORD}
- assertVisible: "Income"
- assertVisible: "Expenses"
- assertVisible: "Net Profit"
- assertVisible: "Cash Drawer"
- assertVisible: "Bank Account"

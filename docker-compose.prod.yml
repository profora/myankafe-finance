name: myankafe-finance

services:
  migrate:
    image: ghcr.io/pressly/goose:3.24.3
    restart: "no"
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL:?DATABASE_URL is required}
      GOOSE_MIGRATION_DIR: /migrations
    volumes:
      - ./backend/db/migrations:/migrations:ro
    command: ["up"]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_MODE: password
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-myankafe_finance_session}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-168}
      AUTH_COOKIE_SECURE: "true"
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_REGION: ${R2_REGION:-auto}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      ATTACHMENT_MAX_MB: ${ATTACHMENT_MAX_MB:-20}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
    ports:
      - "127.0.0.1:${API_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 8s
    stop_grace_period: 20s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    stop_grace_period: 15s

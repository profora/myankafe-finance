name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: myankafe_finance_test
          POSTGRES_USER: myankafe
          POSTGRES_PASSWORD: myankafe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myankafe -d myankafe_finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://myankafe:myankafe_test@localhost:5432/myankafe_finance_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23.x" }
      - name: Check formatting
        run: |
          files="$(gofmt -l backend)"
          if [ -n "$files" ]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi
      - name: Verify Go modules
        working-directory: backend
        run: go mod tidy -diff
      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
      - name: Fresh DB migrations
        run: goose -dir backend/db/migrations postgres "$TEST_DATABASE_URL" up
      - name: Upgrade from migration 13
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          BASE="postgres://myankafe:myankafe_test@localhost:5432"
          psql "$BASE/postgres?sslmode=disable" -c "CREATE DATABASE myankafe_finance_upgrade"
          UPGRADE_URL="$BASE/myankafe_finance_upgrade?sslmode=disable"
          goose -dir backend/db/migrations postgres "$UPGRADE_URL" up-to 13
          psql "$UPGRADE_URL" <<'SQL'
          INSERT INTO users(id,public_id,username,display_name)
          VALUES('00000000-0000-7000-8000-000000000099','01ARZ3NDEKTSV4RRFFQ69G5FAV','upgrade-owner','Upgrade Owner');
          INSERT INTO entities(id,public_id,code,name,entity_type,functional_currency_code,timezone,created_by)
          VALUES('00000000-0000-7000-8000-000000000098','01ARZ3NDEKTSV4RRFFQ69G5FAW','UPGRADE_ENTITY','Upgrade Entity','BUSINESS','MMK','Asia/Yangon','00000000-0000-7000-8000-000000000099');
          INSERT INTO contacts(id,public_id,entity_id,contact_type,display_name,created_by)
          VALUES('00000000-0000-7000-8000-000000000097','01ARZ3NDEKTSV4RRFFQ69G5FAX','00000000-0000-7000-8000-000000000098','CUSTOMER','Upgrade Customer','00000000-0000-7000-8000-000000000099');
          INSERT INTO transactions(id,public_id,entity_id,transaction_type,status,transaction_date,description,currency_code,total_amount,created_by)
          VALUES('00000000-0000-7000-8000-000000000096','01ARZ3NDEKTSV4RRFFQ69G5FAY','00000000-0000-7000-8000-000000000098','EXPENSE','DRAFT','2026-09-01','Upgrade expense','MMK',10,'00000000-0000-7000-8000-000000000099');
          SQL
          goose -dir backend/db/migrations postgres "$UPGRADE_URL" up
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM contact_types WHERE entity_id='00000000-0000-7000-8000-000000000098') <> 5 THEN
              RAISE EXCEPTION 'expected five seeded contact types';
            END IF;
            IF (SELECT contact_type FROM contacts WHERE public_id='01ARZ3NDEKTSV4RRFFQ69G5FAX') <> 'CUSTOMER' THEN
              RAISE EXCEPTION 'historical contact type changed';
            END IF;
            IF (SELECT count(*) FROM transactions WHERE public_id='01ARZ3NDEKTSV4RRFFQ69G5FAY') <> 1 THEN
              RAISE EXCEPTION 'upgrade transaction was lost';
            END IF;
            IF (SELECT symbol FROM currencies WHERE code='MMK') = '' THEN
              RAISE EXCEPTION 'MMK symbol was not backfilled';
            END IF;
            IF (SELECT platform_owner FROM users WHERE username='upgrade-owner') THEN
              RAISE EXCEPTION 'user without an OWNER role became a platform owner';
            END IF;
          END $$;
          SQL
      - name: Upgrade from migration 14
        run: |
          BASE="postgres://myankafe:myankafe_test@localhost:5432"
          psql "$BASE/postgres?sslmode=disable" -c "CREATE DATABASE myankafe_finance_upgrade14"
          UPGRADE_URL="$BASE/myankafe_finance_upgrade14?sslmode=disable"
          goose -dir backend/db/migrations postgres "$UPGRADE_URL" up-to 14
          psql "$UPGRADE_URL" <<'SQL'
          INSERT INTO users(id,public_id,username,display_name)
          VALUES
            ('00000000-0000-7000-8000-000000000091','01ARZ3NDEKTSV4RRFFQ69G5FB1','upgrade14-owner','Upgrade 14 Owner'),
            ('00000000-0000-7000-8000-000000000090','01ARZ3NDEKTSV4RRFFQ69G5FB2','upgrade14-viewer','Upgrade 14 Viewer');
          INSERT INTO entities(id,public_id,code,name,entity_type,functional_currency_code,timezone,created_by)
          VALUES('00000000-0000-7000-8000-000000000089','01ARZ3NDEKTSV4RRFFQ69G5FB3','UPGRADE14','Upgrade 14 Entity','BUSINESS','MMK','Asia/Yangon','00000000-0000-7000-8000-000000000091');
          INSERT INTO user_entity_roles(id,user_id,entity_id,role_id,granted_by)
          VALUES
            ('00000000-0000-7000-8000-000000000088','00000000-0000-7000-8000-000000000091','00000000-0000-7000-8000-000000000089','00000000-0000-7000-8000-000000000001','00000000-0000-7000-8000-000000000091'),
            ('00000000-0000-7000-8000-000000000087','00000000-0000-7000-8000-000000000090','00000000-0000-7000-8000-000000000089','00000000-0000-7000-8000-000000000005','00000000-0000-7000-8000-000000000091');
          SQL
          goose -dir backend/db/migrations postgres "$UPGRADE_URL" up
          psql "$UPGRADE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT (SELECT platform_owner FROM users WHERE username='upgrade14-owner') THEN
              RAISE EXCEPTION 'existing OWNER was not marked platform owner';
            END IF;
            IF (SELECT platform_owner FROM users WHERE username='upgrade14-viewer') THEN
              RAISE EXCEPTION 'non-owner was marked platform owner';
            END IF;
          END $$;
          SQL
      - name: Tests
        working-directory: backend
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t myankafe-finance-api:ci ./backend
      - name: Build web image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
          -t myankafe-finance-web:ci
          ./frontend


  operations-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/dev/null
      - name: Validate operations script syntax
        run: sh -n scripts/postgres-backup.sh scripts/deploy-production.sh
      - name: Validate Caddy template
        run: >-
          docker run --rm
          -e FINANCE_HOST=finance.example.com
          -e FINANCE_API_UPSTREAM=127.0.0.1:8180
          -e FINANCE_WEB_UPSTREAM=127.0.0.1:3100
          -e FINANCE_MAX_BODY=25MB
          -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: myankafe_finance_test
          POSTGRES_USER: myankafe
          POSTGRES_PASSWORD: myankafe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myankafe -d myankafe_finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://myankafe:myankafe_test@localhost:5432/myankafe_finance_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23.x" }
      - name: Format working copy
        run: gofmt -w backend
      - name: Resolve Go modules
        working-directory: backend
        run: go mod tidy
      - name: Tests
        working-directory: backend
        run: go test ./...
      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
      - name: Fresh DB migrations
        run: goose -dir backend/db/migrations postgres "$TEST_DATABASE_URL" up

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_DEV_USER_ULID: 01ARZ3NDEKTSV4RRFFQ69G5FAV
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t myankafe-finance-api:ci ./backend
      - name: Build web image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
          --build-arg NEXT_PUBLIC_DEV_USER_ULID=01ARZ3NDEKTSV4RRFFQ69G5FAV
          -t myankafe-finance-web:ci
          ./frontend

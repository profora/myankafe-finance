name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: myankafe_finance_test
          POSTGRES_USER: myankafe
          POSTGRES_PASSWORD: myankafe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myankafe -d myankafe_finance_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://myankafe:myankafe_test@localhost:5432/myankafe_finance_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23.x" }
      - name: Check formatting
        run: |
          files="$(gofmt -l backend)"
          if [ -n "$files" ]; then
            echo "The following Go files are not gofmt-clean:"
            echo "$files"
            exit 1
          fi
      - name: Verify Go modules
        working-directory: backend
        run: go mod tidy -diff
      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@v3.24.3
      - name: Fresh DB migrations
        run: goose -dir backend/db/migrations postgres "$TEST_DATABASE_URL" up
      - name: Tests
        working-directory: backend
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t myankafe-finance-api:ci ./backend
      - name: Build web image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
          -t myankafe-finance-web:ci
          ./frontend


  operations-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config >/dev/null
      - name: Validate backup script syntax
        run: sh -n scripts/postgres-backup.sh
      - name: Validate Caddy template
        run: >-
          docker run --rm
          -e FINANCE_HOST=finance.example.com
          -e FINANCE_API_UPSTREAM=127.0.0.1:8180
          -e FINANCE_WEB_UPSTREAM=127.0.0.1:3100
          -e FINANCE_MAX_BODY=25MB
          -v "$PWD/deploy/Caddyfile.example:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
